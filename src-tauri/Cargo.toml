[package]
name = "inote"
version = "0.1.0"
description = "Local-first Markdown knowledge base"
authors = ["iNote contributors"]
edition = "2021"

[lib]
name = "inote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "inote"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
notify = "8"
ring = "0.17"
rusqlite = { version = "0.33", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tauri = { version = "2.5.0", features = ["protocol-asset"] }
tempfile = "3"
thiserror = "2"
walkdir = "2"
tauri-plugin-dialog = "2"
font-kit = "0.14.3"

[dev-dependencies]
tempfile = "3"
