<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iNote</title>
    <style id="inote-startup-theme">
      :root {
        background: #f7f5f0;
        color-scheme: light;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          background: #1c1e1a;
          color-scheme: dark;
        }
      }

      html,
      body,
      #root {
        background: inherit;
        min-height: 100%;
      }
    </style>
    <script>
      ;(() => {
        const key = 'inote.themePreference'
        const colorThemeKey = 'inote.colorTheme'
        const colorThemes = ['default', 'forest', 'graphite', 'ember']
        const saved = window.localStorage.getItem(key)
        const savedColorTheme = window.localStorage.getItem(colorThemeKey)
        const preference = saved === 'light' || saved === 'dark' || saved === 'system' ? saved : 'system'
        const colorTheme = colorThemes.includes(savedColorTheme) ? savedColorTheme : 'default'
        const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        const effectiveTheme = preference === 'system' ? (systemDark ? 'dark' : 'light') : preference
        const theme = colorTheme === 'default' ? effectiveTheme : (effectiveTheme === 'dark' ? `${colorTheme}-dark` : colorTheme)
        document.documentElement.dataset.theme = theme
        document.documentElement.dataset.themePreference = preference
        document.documentElement.style.colorScheme = effectiveTheme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
